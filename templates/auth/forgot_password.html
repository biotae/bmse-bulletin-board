{% extends 'base.html' %}
{% block title %}비밀번호 찾기 - GIST BMSE 교수 게시판{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0 mt-3">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-2 fw-bold">
          <i class="bi bi-envelope-at text-primary me-2"></i>비밀번호 찾기
        </h4>
        <p class="text-center text-muted small mb-4">
          가입 시 등록한 이메일 주소를 입력하시면<br>
          비밀번호 재설정 링크를 보내드립니다.
        </p>

        <form method="POST" action="{{ url_for('forgot_password') }}" novalidate>
          <div class="mb-4">
            <label for="email" class="form-label fw-semibold">이메일</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="가입한 이메일 주소를 입력하세요"
              value="{{ request.form.get('email', '') }}"
              required
              autofocus
            />
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-send me-1"></i>재설정 링크 발송
            </button>
          </div>
        </form>

        <hr class="my-3" />

        <p class="text-center text-muted small mb-0">
          비밀번호가 기억나셨나요?
          <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">로그인</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
