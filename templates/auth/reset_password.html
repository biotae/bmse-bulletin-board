{% extends 'base.html' %}
{% block title %}비밀번호 재설정 - GIST BMSE 교수 게시판{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0 mt-3">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-4 fw-bold">
          <i class="bi bi-key text-primary me-2"></i>비밀번호 재설정
        </h4>

        <form method="POST" action="{{ url_for('reset_password', token=token) }}" novalidate>
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">새 비밀번호</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="새 비밀번호를 입력하세요"
              required
              autofocus
            />
          </div>

          <div class="mb-4">
            <label for="confirm_password" class="form-label fw-semibold">새 비밀번호 확인</label>
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              class="form-control"
              placeholder="새 비밀번호를 다시 입력하세요"
              required
            />
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-check-circle me-1"></i>비밀번호 변경
            </button>
          </div>
        </form>

        <hr class="my-3" />

        <p class="text-center text-muted small mb-0">
          <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">로그인으로 돌아가기</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
