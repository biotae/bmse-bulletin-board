{% extends 'base.html' %}
{% block title %}{% if notice %}공지 수정{% else %}새 공지{% endif %} - GIST BMSE 교수 게시판{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="fw-bold mb-0">
    <i class="bi bi-megaphone text-primary me-2"></i>
    {% if notice %}공지사항 수정{% else %}새 공지사항{% endif %}
  </h4>
  <a href="{{ url_for('admin_notices') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>목록
  </a>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label for="title" class="form-label fw-semibold">제목</label>
        <input type="text" id="title" name="title" class="form-control"
               value="{{ notice.title if notice else '' }}" required>
      </div>
      <div class="mb-4">
        <label for="content" class="form-label fw-semibold">내용</label>
        <textarea id="content" name="content" class="form-control" rows="8" required>{{ notice.content if notice else '' }}</textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle me-1"></i>저장
        </button>
        <a href="{{ url_for('admin_notices') }}" class="btn btn-outline-secondary">취소</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
