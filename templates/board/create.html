{% extends 'base.html' %}
{% block title %}글쓰기 - GIST BMSE 교수 게시판{% endblock %}

{% block head %}
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
<style>
  .ql-editor { font-size: 1.1rem; line-height: 1.8; }
  .ql-editor p { margin-bottom: 0.4em; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="fw-bold mb-0">
    <i class="bi bi-pencil-square text-primary me-2"></i>글쓰기
  </h4>
  <a href="{{ url_for('board_list') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-x-lg me-1"></i>취소
  </a>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body p-4">
    <form method="POST" action="{{ url_for('board_create') }}" enctype="multipart/form-data" novalidate>
      <!-- Title -->
      <div class="mb-3">
        <label for="title" class="form-label fw-semibold">제목 <span class="text-danger">*</span></label>
        <input
          type="text"
          id="title"
          name="title"
          class="form-control form-control-lg"
          placeholder="제목을 입력하세요"
          value="{{ request.form.get('title', '') }}"
          required
          autofocus
        />
      </div>

      <!-- Content -->
      <div class="mb-3">
        <label class="form-label fw-semibold">내용 <span class="text-danger">*</span></label>
        <div id="editor" style="min-height:300px;"></div>
        <input type="hidden" id="content" name="content">
      </div>

      <!-- File upload -->
      <div class="mb-4">
        <label for="files" class="form-label fw-semibold">
          <i class="bi bi-paperclip me-1"></i>파일 첨부
        </label>
        <input
          type="file"
          id="files"
          name="files"
          class="form-control"
          multiple
          accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.hwp,.zip,.jpg,.jpeg,.png,.gif"
        />
        <div class="form-text text-muted">
          허용 형식: PDF, Word, Excel, PowerPoint, HWP, ZIP, 이미지(JPG/PNG/GIF) | 최대 50MB
        </div>
      </div>

      <!-- Submit -->
      <div class="d-flex gap-2 justify-content-end">
        <a href="{{ url_for('board_list') }}" class="btn btn-outline-secondary">취소</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-lg me-1"></i>등록
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script>
  function imageHandler() {
    var input = document.createElement('input');
    input.setAttribute('type', 'file');
    input.setAttribute('accept', 'image/*');
    input.click();
    input.onchange = function() {
      uploadImage(input.files[0]);
    };
  }

  function uploadImage(file) {
    var fd = new FormData();
    fd.append('image', file);
    fetch('/upload/image', { method: 'POST', body: fd })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.url) {
          var range = quill.getSelection(true);
          quill.insertEmbed(range.index, 'image', data.url);
          quill.setSelection(range.index + 1);
        } else {
          alert(data.error || '이미지 업로드 실패');
        }
      });
  }

  var quill = new Quill('#editor', {
    theme: 'snow',
    placeholder: '내용을 입력하세요',
    modules: {
      toolbar: {
        container: [
          ['bold', 'italic', 'underline'],
          [{ 'color': [] }],
          ['image'],
          ['clean']
        ],
        handlers: { image: imageHandler }
      }
    }
  });

  // 클립보드 이미지 붙여넣기
  quill.root.addEventListener('paste', function(e) {
    var items = (e.clipboardData || {}).items || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) {
        e.preventDefault();
        uploadImage(items[i].getAsFile());
        return;
      }
    }
  });

  document.querySelector('form').addEventListener('submit', function(e) {
    var content = quill.root.innerHTML.trim();
    if (content === '<p><br></p>' || content === '') {
      e.preventDefault();
      alert('내용을 입력해주세요.');
      return;
    }
    document.getElementById('content').value = content;
  });
</script>
{% endblock %}
